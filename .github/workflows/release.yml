name: Build, test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example v1.0.0); empty only builds'
        required: false
        default: ''
permissions:
  contents: read
env:
  XRAY_VERSION: v26.3.27
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: go test ./...
      - name: Validate shell scripts
        run: bash -n install.sh x-ui.sh scripts/package.sh
      - name: Download pinned Xray
        run: |
          mkdir -p .work/xray
          curl -fL --retry 3 "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip" -o .work/xray.zip
          unzip -q .work/xray.zip -d .work/xray
          chmod +x .work/xray/xray
      - name: Test every inbound and transport with real Xray
        run: XRAY_BINARY="$PWD/.work/xray/xray" node --test tests/*.test.cjs
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64, s390x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - run: bash scripts/package.sh '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: x-ui-linux-${{ matrix.arch }}
          path: dist/x-ui-linux-${{ matrix.arch }}.tar.gz
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish versioned assets and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          cd dist
          sha256sum x-ui-linux-*.tar.gz > SHA256SUMS
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes x-ui-linux-*.tar.gz SHA256SUMS
